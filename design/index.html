<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo · RAKÜN Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=JetBrains+Mono:wght@500&display=swap">
<style>
  @font-face { font-family: "Knuckle Down"; src: url("proto/fonts/KnuckleDown.otf") format("opentype"); font-display: block; }
  :root { --ink: #010221; --s2: #14132B; --pink: #FF2C68; --yellow: #FFF02B; --mist: #C3C0DD; --dim: #9A97BD; --line: rgba(255,255,255,.14); --w: 360px; --h: 800px; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ink); color: #fff; font: 400 16px/1.45 "Jost", sans-serif; }
  ::selection { background: var(--pink); color: #1B1A35; }
  :focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
  header { position: sticky; top: 0; z-index: 5; background: var(--ink); border-bottom: 1px solid var(--line); padding: 20px 32px 16px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 32px; }
  h1 { margin: 0; font: 400 44px/.86 "Knuckle Down", sans-serif; text-transform: uppercase; letter-spacing: -.01em; }
  h1 em { font-style: normal; color: var(--pink); }
  .meta { margin: 6px 0 0; color: var(--mist); font-size: 14px; max-width: 60ch; }
  .ctrl { display: flex; flex-wrap: wrap; gap: 20px; margin-left: auto; }
  .ctrl fieldset { border: 0; padding: 0; margin: 0; display: flex; gap: 6px; align-items: center; }
  .ctrl legend { float: left; margin-right: 8px; font: 500 11px/1 "JetBrains Mono", monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
  .ctrl button { height: 36px; padding: 0 12px; border: 1px solid rgba(255,255,255,.28); background: none; color: var(--mist); font: 500 13px/1 "Jost", sans-serif; cursor: pointer; }
  .ctrl button[aria-pressed="true"] { background: #fff; color: var(--ink); border-color: #fff; }
  main { padding: 8px 32px 64px; }
  h2 { display: flex; align-items: baseline; gap: 12px; margin: 40px 0 16px; padding-bottom: 10px; border-bottom: 1px solid var(--line); font: 400 26px/.95 "Knuckle Down", sans-serif; text-transform: uppercase; }
  h2 small { font: 500 12px/1 "JetBrains Mono", monospace; letter-spacing: .06em; color: var(--dim); text-transform: uppercase; }
  .row { display: flex; gap: 28px; overflow-x: auto; padding-bottom: 12px; scrollbar-color: rgba(255,255,255,.28) transparent; }
  figure { margin: 0; flex: none; width: var(--w); }
  .phone { width: var(--w); height: var(--h); border: 1px solid rgba(255,255,255,.28); background: var(--ink); position: relative; }
  .phone::before { content: ""; position: absolute; inset: 0; background: var(--pink); transform: translate(8px, 8px); z-index: -1; opacity: 0; }
  figure:hover .phone::before { opacity: .9; }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--ink); }
  figcaption { display: flex; justify-content: space-between; gap: 12px; margin-top: 14px; font-size: 14px; }
  figcaption b { font-weight: 500; }
  figcaption a { color: var(--mist); font: 500 12px/1.4 "JetBrains Mono", monospace; text-decoration-color: var(--pink); text-underline-offset: 3px; white-space: nowrap; }
  figcaption span { color: var(--dim); display: block; font-size: 13px; }
  .note { margin: 24px 0 0; padding: 14px 16px; border: 1px solid var(--line); background: var(--s2); color: var(--mist); font-size: 14px; max-width: 80ch; }
  .note b { color: #fff; font-weight: 500; }
</style>
</head>
<body>
<header>
  <div>
    <h1>RAKÜN <em>Studio</em> · prototipo</h1>
    <p class="meta">Fase 3 · todas las pantallas a tamaño real. <b>Datos de ejemplo</b>: ningún cliente, cifra o nombre es real. Toca dentro de cada teléfono: los botones, hojas y enlaces funcionan.</p>
  </div>
  <div class="ctrl">
    <fieldset data-size><legend>Tamaño</legend><button type="button" aria-pressed="true" data-w="360" data-h="800">360 × 800</button><button type="button" aria-pressed="false" data-w="390" data-h="844">390 × 844</button></fieldset>
    <fieldset data-tema><legend>Tema</legend><button type="button" aria-pressed="true" data-t="oscuro">Oscuro</button><button type="button" aria-pressed="false" data-t="claro">Claro</button></fieldset>
    <fieldset data-rol><legend>Rol</legend><button type="button" aria-pressed="true" data-r="admin">Admin</button><button type="button" aria-pressed="false" data-r="manager">Manager</button><button type="button" aria-pressed="false" data-r="directora">Directora</button><button type="button" aria-pressed="false" data-r="editor">Editor</button><button type="button" aria-pressed="false" data-r="camara">Cámara</button></fieldset>
  </div>
</header>
<main id="g"></main>
<script>
  const SECTIONS = [
    ['Entrada', 'Splash, login y casos de acceso', [
      ['splash.html?auto=0', 'Splash', 'El ojo se abre en menos de 1,5 s'],
      ['login.html', 'Iniciar sesión', ''],
      ['recuperar.html', 'Recuperar contraseña', 'El enlace abre cuenta.html'],
      ['sin-acceso.html', 'Cuenta de cliente', 'Acceso negado en v1'],
    ]],
    ['P1 · uso diario', 'Lo que se monta primero', [
      ['hoy.html', 'Hoy', 'Inicio de la app'],
      ['tarea.html', 'Tarea', 'Ficha de un entregable'],
      ['tarea.html?hoja=entregar', 'Entregar', 'Cámara, galería, archivo o enlace'],
      ['revisar.html', 'Revisar', 'Aprobar o devolver'],
      ['solicitud.html', 'Ficha de solicitud', 'Llamar y WhatsApp a un toque'],
      ['clientes.html', 'Clientes', ''],
      ['clientes.html?hoja=acceso', 'Crear acceso', 'Enlace para WhatsApp'],
      ['proyectos.html', 'Proyectos', ''],
      ['proyecto.html', 'Proyecto', 'Etapa y entregables'],
      ['proyecto.html?hoja=editar', 'Editar entregable', 'Reemplaza la tabla de 9 columnas'],
      ['agenda.html', 'Agenda', 'Grabaciones + reuniones'],
      ['agenda.html?hoja=confirmar', 'Confirmar reunión pedida', ''],
      ['grabacion.html', 'Grabación', 'Cómo llegar, llamar, qué prepara'],
      ['parrilla.html', 'Parrilla · por día', 'Enviar al cliente para aprobar'],
      ['parrilla.html?hoja=pieza', 'Pieza de la parrilla', ''],
      ['mensajes.html', 'Mensajes', ''],
      ['mas.html', 'Más', 'Todo lo demás, según permisos'],
    ]],
    ['Solicitudes', 'Dirección A elegida por Wilmer', [
      ['solicitudes-a.html', 'Solicitudes · por estado', 'Una pestaña por estado, como la web'],
      ['solicitudes-b.html', 'B · descartada', 'Se guarda solo como registro'],
    ]],
    ['P2 · consulta y dinero', 'Se monta después de P1', [
      ['documentos.html', 'Documentos', 'Escanear con la cámara'],
      ['cotizacion.html', 'Cotización', 'Bloques, cuotas y total'],
      ['cotizacion.html?hoja=pago', 'Registrar pago', 'Con el primero se crean los proyectos'],
      ['metricas.html', 'Métricas', 'Semáforo con forma, no solo color'],
    ]],
    ['Estados', 'En las pantallas clave', [
      ['hoy.html?estado=cargando', 'Cargando', ''],
      ['hoy.html?estado=vacio', 'Vacío', 'Momento de marca'],
      ['solicitudes-a.html?estado=error', 'Error', ''],
      ['hoy.html?estado=offline', 'Sin conexión', 'Se ve lo guardado; no se escribe'],
      ['mas.html', 'Apariencia', 'Más → Cuenta: Oscuro · Claro · Teléfono'],
      ['solicitudes-a.html?estado=sinpermiso', 'Sin permiso', ''],
      ['agenda.html?estado=vivo', 'Llegó algo en vivo', 'No mueve lo que estás leyendo'],
    ]],
    ['Barra inferior por rol', 'Misma pantalla Hoy, distinta barra', [
      ['hoy.html?rol=admin', 'Admin', 'Hoy · Solicitudes · Agenda · Proyectos · Más'],
      ['hoy.html?rol=manager', 'Manager', 'Hoy · Solicitudes · Clientes · Proyectos · Más'],
      ['hoy.html?rol=directora', 'Directora', 'Hoy · Agenda · Proyectos · Parrillas · Más'],
      ['hoy.html?rol=editor', 'Editor/a', 'Hoy · Mensajes · Más'],
      ['hoy.html?rol=camara', 'Cámara', 'Hoy · Agenda · Mensajes · Más'],
    ]],
  ];
  let rol = 'admin'; let tema = 'oscuro';
  const src = (u) => { const sep = u.includes('?') ? '&' : '?'; return /[?&]rol=/.test(u) ? `pantallas/${u}&tema=${tema}` : `pantallas/${u}${sep}rol=${rol}&tema=${tema}`; };
  function draw() {
    document.getElementById('g').innerHTML = SECTIONS.map(([t, s, items]) => `
      <h2>${t} <small>${s} · ${items.length}</small></h2>
      <div class="row">${items.map(([u, n, d]) => `
        <figure><div class="phone"><iframe src="${src(u)}" title="${n}" loading="lazy"></iframe></div>
        <figcaption><span><b>${n}</b>${d ? `<span>${d}</span>` : ''}</span><a href="${src(u)}" target="_blank" rel="noopener">abrir ↗</a></figcaption></figure>`).join('')}</div>`).join('')
      + '<p class="note"><b>Cómo revisarlo:</b> abre este archivo en Chrome. Para verlo como en el celular, abre una pantalla sola (↗) y usa las herramientas de desarrollador en modo dispositivo. La lista para marcar está en <b>design/APROBACION.md</b>.</p>';
  }
  document.querySelectorAll('[data-size] button').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('[data-size] button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    document.documentElement.style.setProperty('--w', `${b.dataset.w}px`);
    document.documentElement.style.setProperty('--h', `${b.dataset.h}px`);
  }));
  document.querySelectorAll('[data-rol] button').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('[data-rol] button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    rol = b.dataset.r; draw();
  }));
  document.querySelectorAll('[data-tema] button').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('[data-tema] button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    tema = b.dataset.t; draw();
  }));
  draw();
</script>
</body>
</html>
