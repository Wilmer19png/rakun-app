<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar · RAKÜN Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@20..48,300..400,0..1,0&display=block">
<link rel="stylesheet" href="../proto/app.css">
<script src="../proto/tema.js"></script>
</head>
<body data-screen="login">
<form class="auth" action="hoy.html">
  <div class="auth__head">
    <img src="../proto/assets/rakun-isotipo.svg" alt="RAKÜN" width="120" height="120">
    <h1 class="auth__t">Entra al <em>estudio.</em></h1>
  </div>
  <div class="auth__body">
    <label class="f"><span>Correo</span><input class="in" type="email" inputmode="email" autocomplete="username" autocapitalize="off" value="wilmer@ejemplo.com"></label>
    <label class="f"><span>Contraseña</span><span class="pass"><input class="in" type="password" autocomplete="current-password" value="contraseña-de-ejemplo"><button class="ib" type="button" data-pass aria-label="Mostrar contraseña"><span class="ic">visibility</span></button></span></label>
    <p class="help"><a href="recuperar.html" style="color:var(--white);text-underline-offset:3px;text-decoration-color:var(--pink)">Olvidé mi contraseña</a></p>
  </div>
  <div class="pad" style="padding-bottom:24px"><button class="btn btn--block" type="submit">Entrar</button></div>
</form>
<script type="module" src="../proto/app.js"></script>
</body>
</html>
